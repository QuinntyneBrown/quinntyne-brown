<ng-template #nameCell let-type>
  <ft-link [href]="context.base() + '/org-types/' + type.id">{{ type.name }}</ft-link>
</ng-template>
<ft-portfolio-header current="org-types">
  @if (context.allowed()) {
    <ft-button portfolioActions variant="primary" (click)="create()">
      <ft-icon name="add" /> New Org Type
    </ft-button>
  }
</ft-portfolio-header>
@if (context.allowed()) {
  @if (state() === 'error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load the Org Types"
      text="Check your connection and try again."
    >
      <ft-button actions variant="primary" (click)="load()">Try again</ft-button>
    </ft-empty-state>
  } @else {
    <ft-table
      [caption]="'Org Types in the ' + (context.portfolio()?.name ?? '') + ' portfolio'"
      [columns]="columns()"
      [rows]="rows()"
      [loading]="state() === 'loading'"
    />
  }
}
