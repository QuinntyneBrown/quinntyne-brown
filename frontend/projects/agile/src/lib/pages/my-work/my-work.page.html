<ng-template #itemCell let-item>
  <ft-link [href]="item.href">{{ item.title }}</ft-link>
</ng-template>
<ng-template #orgCell let-item>
  @if (item.organization; as org) {
    <ft-org-label [name]="org.name" />
  }
</ng-template>

<ft-page-header title="My work" subtitle="Work assigned to you in every org you cover" />

@switch (state()) {
  @case ('loading') {
    <ft-list-skeleton label="Loading your work" [rows]="4" />
  }
  @case ('error') {
    <ft-empty-state
      variant="error"
      heading="We couldn’t load your work"
      text="Check your connection and try again. If it keeps happening, we’ve already been told about it."
    >
      <ft-button actions variant="primary" (click)="retry()">Try again</ft-button>
    </ft-empty-state>
  }
  @case ('loaded') {
    @if (empty()) {
      <ft-empty-state
        icon="workspaces"
        heading="Nothing assigned to you"
        text="When someone assigns you a story or task in a workspace, it shows up here."
      />
    } @else {
      <ft-card variant="flush">
        <ft-table
          caption="Work assigned to you across your orgs"
          [columns]="columns()"
          [rows]="rows()"
        />
      </ft-card>
    }
  }
}
