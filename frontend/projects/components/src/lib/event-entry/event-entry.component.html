<h3 class="heading">
  <button
    #toggleRef
    class="toggle"
    type="button"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId"
    (click)="toggle()"
  >
    <span class="title">
      <ft-badge [variant]="kindTone()">{{ kind() }}</ft-badge>
      <span [class.mono]="titleMono()">{{ title() }}</span>
    </span>
    @if (meta()) {
      <span class="meta">{{ meta() }}</span>
    }
    @if (preview() && !expanded()) {
      <span class="meta">{{ preview() }}</span>
    }
    <ft-icon class="chevron" name="chevron-down" />
  </button>
</h3>
<div class="body" [id]="bodyId" [hidden]="!expanded()">
  @if (expanded()) {
    @if (json(); as data) {
      <p class="caption">
        This kind of event has no view of its own yet. Its data is shown as sent.
      </p>
      <pre class="json"><code>{{ data }}</code></pre>
    } @else {
      <ng-content />
    }
  }
</div>
