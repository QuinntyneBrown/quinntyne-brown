<div class="orderList">
    <div class="orderList-header">
        <h1>Orders</h1>
    </div>
    
    <div data-ng-repeat="entity in vm.entities" class="orderList-item">
        <div class="orderList-name">
            {{ entity.name }}
        </div>
        <div class="orderList-actions">
            <span data-ng-click="vm.edit({ entity: this.entity })">edit</span>&nbsp;&nbsp;|&nbsp;&nbsp;<span data-ng-click="vm.remove({ entity: this.entity })">remove</span>
        </div>
        <div style="clear:both;"></div>
    </div>
</div>
