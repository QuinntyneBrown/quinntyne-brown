<div class="productList">
    <div class="productList-header">
        <h1>Products</h1>
    </div>
    
    <div data-ng-repeat="entity in vm.entities" class="productList-item">
        <div class="productList-name">
            {{ entity.name }}
        </div>
        <div class="productList-actions">
            <span data-ng-click="vm.edit({ entity: this.entity })">edit</span>&nbsp;&nbsp;|&nbsp;&nbsp;<span data-ng-click="vm.remove({ entity: this.entity })">remove</span>
        </div>
        <div style="clear:both;"></div>
    </div>
</div>
