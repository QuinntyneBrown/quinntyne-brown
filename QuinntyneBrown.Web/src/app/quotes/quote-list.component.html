<div class="quoteList">
    <div class="quoteList-header">
        <h1>Quotes</h1>
    </div>
    
    <div data-ng-repeat="entity in vm.entities" class="quoteList-item">
        <div class="quoteList-name">
            {{ entity.name }}
        </div>
        <div class="quoteList-actions">
            <span data-ng-click="vm.edit({ entity: this.entity })">edit</span>&nbsp;&nbsp;|&nbsp;&nbsp;<span data-ng-click="vm.remove({ entity: this.entity })">remove</span>
        </div>
        <div style="clear:both;"></div>
    </div>
</div>
