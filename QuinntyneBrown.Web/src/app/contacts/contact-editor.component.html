<div class="contact-editor">

    <div class="contact-editor-inner">

        <div class="contact-editor-form">
            <h2>Contact</h2>

            <div>
                <input type="text" class="contact-editor-form-input" placeholder="Name" data-ng-model="vm.entity.name" />
            </div>
            <div>
                <input type="text" class="contact-editor-form-input" placeholder="Email" data-ng-model="vm.entity.email" />
            </div>
            <div>
                <input type="text" class="contact-editor-form-input" placeholder="Message" data-ng-model="vm.entity.message" />
            </div>

            <button on-click="vm.onTryToSaveContact({ data: vm.entity })" caption="Send Message"></button>

        </div>

    </div>

</div>
