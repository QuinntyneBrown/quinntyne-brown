<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Quinntyne Brown brochure deck</title>
    <!-- Design-system tokens and mock photos only (ADR 0020); build.mjs shows one slide at a time. -->
    <link rel="stylesheet" href="../../../docs/design-system/tokens/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--color-bg-canvas);
        color: var(--color-fg-default);
        font: var(--text-body-lg);
      }
      section {
        display: none;
        position: absolute;
        inset: 0;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: var(--space-12);
        padding: var(--space-16);
        box-sizing: border-box;
      }
      section.current {
        display: grid;
      }
      .copy {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }
      .eyebrow {
        font: var(--text-overline);
        letter-spacing: var(--letter-spacing-wide);
        text-transform: uppercase;
        color: var(--color-fg-accent);
        margin: 0;
      }
      h1,
      h2 {
        font: var(--text-display);
        letter-spacing: var(--letter-spacing-tight);
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--color-fg-muted);
      }
      img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-3);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        font: var(--text-h3);
      }
      .brand img {
        width: var(--size-avatar-lg);
        aspect-ratio: 1;
        box-shadow: none;
        border-radius: var(--radius-md);
      }
      .covers {
        position: relative;
        aspect-ratio: 4 / 3;
      }
      .covers img {
        position: absolute;
        width: 72%;
        aspect-ratio: 16 / 10;
      }
      .covers img:first-child {
        left: 0;
        top: 4%;
      }
      .covers img:last-child {
        right: 0;
        bottom: 4%;
      }
      .cta {
        display: inline-block;
        align-self: flex-start;
        padding: var(--space-4) var(--space-8);
        border-radius: var(--radius-full);
        background: var(--color-accent);
        color: var(--color-fg-on-accent);
        font: var(--text-h4);
      }
    </style>
  </head>
  <body>
    <section id="projects">
      <div class="copy">
        <div class="brand">
          <img src="../../../docs/design-system/assets/qb-logo.svg" alt="" />Quinntyne Brown
        </div>
        <p class="eyebrow">Open source</p>
        <h1>Shelfie, Sweet Hand and more. Jump in anywhere.</h1>
      </div>
      <div class="covers">
        <img src="../../../frontend/projects/marketing/public/projects/shelfie.webp" alt="" />
        <img src="../../../frontend/projects/marketing/public/projects/sweet-hand.webp" alt="" />
      </div>
    </section>
    <section id="connect">
      <div class="copy">
        <p class="eyebrow">Home base</p>
        <h2>The people, the events, the notes and the backlog</h2>
      </div>
      <img src="../../../docs/mocks/assets/photos/whiteboard-talk.jpg" alt="" />
    </section>
    <section id="impact">
      <div class="copy">
        <p class="eyebrow">Why it matters</p>
        <h2>Less catching up. More impact.</h2>
      </div>
      <img src="../../../docs/mocks/assets/photos/hackathon-pairing.jpg" alt="" />
    </section>
    <section id="join">
      <div class="copy">
        <p class="eyebrow">Stay connected</p>
        <h2>Make a profile</h2>
        <span class="cta">www.quinntynebrown.com</span>
      </div>
      <img src="../../../docs/mocks/assets/photos/city.jpg" alt="" />
    </section>
  </body>
</html>
